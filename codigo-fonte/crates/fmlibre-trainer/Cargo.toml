[package]
name = "fmlibre-trainer"
version = "0.5.3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "FM Livre integration of the MIT-licensed FM27 Trainer engine"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
base64 = "0.23"
fm27-agent = { path = "../../vendor/fm27-trainer/agent" }
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.9.8"
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }
